<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Amont</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>

  :root{
    --bg:#EDEFF1; --surface:#FFFFFF; --surface-2:#F6F7F8;
    --ink:#0F161C; --ink-2:#495866; --ink-3:#77848F;
    --rule:#D5DBE0; --rule-2:#E5E9EC;
    --accent:#A8542A; --accent-soft:#F0E2D9;
    --slate:#2F515C;
    --ok:#276B4E; --ok-soft:#DDEBE4;
    --warn:#8A5D0C; --warn-soft:#F4E8D2;
    --crit:#9C2E28; --crit-soft:#F5DEDC;
    --info:#2C5C6C; --info-soft:#DCE8EC;
    --f-rte:#2F515C; --f-rte-soft:#DDE6EA;
    --f-enedis:#4A6B2A; --f-enedis-soft:#E3ECDA;
    --f-grdf:#7A5A1E; --f-grdf-soft:#F1E8D6;
    --nav:#0F161C; --nav-ink:#E7ECF0; --nav-ink-2:#9EACB8;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#0E1318; --surface:#161D24; --surface-2:#1C242C;
      --ink:#E7ECF0; --ink-2:#9EACB8; --ink-3:#75838F;
      --rule:#2A343D; --rule-2:#222B33;
      --accent:#D5854F; --accent-soft:#33241B;
      --slate:#7FA6B3;
      --ok:#6FBF97; --ok-soft:#16281F;
      --warn:#D6A552; --warn-soft:#2A2214;
      --crit:#E08880; --crit-soft:#2C1A18;
      --info:#7FB6C9; --info-soft:#152429;
      --f-rte:#8FB3C0; --f-rte-soft:#182229;
      --f-enedis:#A3C47E; --f-enedis-soft:#1B2416;
      --f-grdf:#D2B06A; --f-grdf-soft:#292115;
      --nav:#080C10; --nav-ink:#E7ECF0; --nav-ink-2:#8A98A4;
    }
  }
  :root[data-theme="dark"]{
    --bg:#0E1318; --surface:#161D24; --surface-2:#1C242C;
    --ink:#E7ECF0; --ink-2:#9EACB8; --ink-3:#75838F;
    --rule:#2A343D; --rule-2:#222B33;
    --accent:#D5854F; --accent-soft:#33241B;
    --slate:#7FA6B3;
    --ok:#6FBF97; --ok-soft:#16281F;
    --warn:#D6A552; --warn-soft:#2A2214;
    --crit:#E08880; --crit-soft:#2C1A18;
    --info:#7FB6C9; --info-soft:#152429;
    --f-rte:#8FB3C0; --f-rte-soft:#182229;
    --f-enedis:#A3C47E; --f-enedis-soft:#1B2416;
    --f-grdf:#D2B06A; --f-grdf-soft:#292115;
    --nav:#080C10; --nav-ink:#E7ECF0; --nav-ink-2:#8A98A4;
  }
  *{box-sizing:border-box}
  body{background:var(--bg); color:var(--ink); font-family:"IBM Plex Sans",system-ui,sans-serif; font-size:14px; line-height:1.5; margin:0; -webkit-font-smoothing:antialiased}
  h1,h2,h3{font-family:Archivo,"IBM Plex Sans",sans-serif; margin:0; text-wrap:balance}
  a{color:inherit}
  .mono{font-family:"IBM Plex Mono",ui-monospace,monospace; font-variant-numeric:tabular-nums}

  /* barre de navigation du site */
  .topbar{background:var(--nav); color:var(--nav-ink); border-bottom:3px solid var(--accent)}
  .topbar .in{max-width:1240px; margin:0 auto; padding:0 22px; display:flex; align-items:center; gap:16px; min-height:52px; flex-wrap:wrap}
  .logo{font-family:Archivo,sans-serif; font-weight:700; letter-spacing:-.01em; font-size:15px; display:flex; align-items:baseline; gap:8px}
  .logo small{font-family:"IBM Plex Mono",monospace; font-size:10px; letter-spacing:.14em; text-transform:uppercase; color:var(--accent); font-weight:600}
  nav.menu{display:flex; gap:2px; flex:1; flex-wrap:wrap; padding:9px 0}
  nav.menu a{text-decoration:none; padding:6px 9px; font-size:13px; font-weight:500; color:var(--nav-ink-2); border:1.5px solid transparent; border-radius:3px; white-space:nowrap}
  nav.menu a.on{color:var(--nav-ink); border-color:var(--accent)}
  nav.menu a:hover{color:var(--nav-ink); border-color:var(--nav-ink-2)}
  nav.menu a.on:hover{border-color:var(--accent)}
  nav.menu .badge{display:inline-block; min-width:17px; padding:0 5px; margin-left:5px; border-radius:9px; background:var(--accent); color:#fff; font-family:"IBM Plex Mono",monospace; font-size:10px; line-height:16px; text-align:center; font-weight:600}
  .who{font-family:"IBM Plex Mono",monospace; font-size:11px; color:var(--nav-ink-2); display:flex; align-items:center; gap:6px}
  .who b{color:var(--nav-ink); font-weight:500}
  .who input{width:128px; background:transparent; color:var(--nav-ink); border:1px solid var(--nav-ink-2); font-family:"IBM Plex Mono",monospace; font-size:11px; padding:4px 7px}
  .who input:placeholder-shown{border-color:var(--accent)}
  .proto{background:var(--accent-soft); color:var(--accent); font-family:"IBM Plex Mono",monospace; font-size:11px; letter-spacing:.06em; text-align:center; padding:5px 16px}

  .wrap{max-width:1240px; margin:0 auto; padding:24px 22px 72px}
  .crumbs{font-family:"IBM Plex Mono",monospace; font-size:11px; color:var(--ink-3); margin-bottom:14px}
  .crumbs a{color:var(--ink-3); text-decoration:none}
  .crumbs a:hover{color:var(--accent)}
  .pagehead{display:flex; flex-wrap:wrap; align-items:flex-end; justify-content:space-between; gap:16px; padding-bottom:16px; border-bottom:2px solid var(--ink); margin-bottom:22px}
  .pagehead h1{font-size:26px; font-weight:700; letter-spacing:-.02em; line-height:1.1}
  .pagehead .sub{color:var(--ink-2); margin:6px 0 0; max-width:70ch}
  .totaux{display:flex; gap:26px; flex-wrap:wrap}
  .tot .v{font-family:Archivo,sans-serif; font-size:24px; font-weight:600; letter-spacing:-.02em; font-variant-numeric:tabular-nums; line-height:1}
  .tot .k{font-family:"IBM Plex Mono",monospace; font-size:10px; letter-spacing:.13em; text-transform:uppercase; color:var(--ink-3); margin-top:5px}

  .bloc{background:var(--surface); border:1px solid var(--rule); border-radius:3px; overflow:hidden; margin-bottom:22px}
  .bloc-head{display:flex; align-items:center; justify-content:space-between; gap:14px; padding:12px 16px; border-bottom:1px solid var(--rule); flex-wrap:wrap}
  h2{font-size:14px; font-weight:600}
  .tbl-scroll{overflow-x:auto}
  table{width:100%; border-collapse:collapse}
  th{font-family:"IBM Plex Mono",monospace; font-size:9.5px; letter-spacing:.13em; text-transform:uppercase; color:var(--ink-3); font-weight:500; text-align:left; padding:9px 14px; border-bottom:1px solid var(--rule); white-space:nowrap}
  th.num,td.num{text-align:right}
  td{padding:10px 14px; border-bottom:1px solid var(--rule-2); vertical-align:top}
  tbody tr:last-child td{border-bottom:0}
  tr.lien{cursor:pointer}
  tr.lien:hover td{background:var(--surface-2)}
  table.matrice{min-width:900px}
  table.matrice th.fil{text-align:center}
  table.matrice td.cell{text-align:center; padding:8px 10px}
  .cellbtn{display:inline-flex; flex-direction:column; align-items:center; gap:3px; min-width:128px; padding:7px 10px; border:1px solid var(--rule); border-radius:3px; background:var(--surface); cursor:pointer; font:inherit; color:var(--ink); text-decoration:none}
  .cellbtn:hover{border-color:var(--ink-3); background:var(--surface-2)}
  .cellbtn.vide{border-style:dashed; color:var(--ink-3); font-size:12px}
  .cellbtn .e{font-size:11px; color:var(--ink-3); font-family:"IBM Plex Mono",monospace}
  .cellbtn .e.crit{color:var(--crit); font-weight:600}
  .cellbtn .e.warn{color:var(--warn); font-weight:600}
  .projname{font-weight:600}
  .projname a{text-decoration:none}
  .projname a:hover{color:var(--accent)}
  .projmeta{color:var(--ink-3); font-size:12px; margin-top:2px}

  .alertes{display:flex; flex-direction:column; gap:1px; background:var(--rule-2); border:1px solid var(--rule); border-radius:3px; overflow:hidden; margin-bottom:22px}
  .al{display:flex; gap:12px; align-items:baseline; padding:9px 14px; background:var(--surface); flex-wrap:wrap}
  .al.crit{border-left:3px solid var(--crit)}
  .al.warn{border-left:3px solid var(--warn)}
  .al code{font-family:"IBM Plex Mono",monospace; font-size:11.5px; font-weight:600; color:var(--accent)}
  .al code a{text-decoration:none}
  .al span{color:var(--ink-2)}
  .al b{color:var(--ink); font-weight:600}

  .ftag{display:inline-block; font-family:"IBM Plex Mono",monospace; font-size:10px; letter-spacing:.1em; text-transform:uppercase; padding:2px 7px; border-radius:2px; font-weight:600; white-space:nowrap}
  .ftag.rte_ee,.ftag.rte_ptf{background:var(--f-rte-soft); color:var(--f-rte)}
  .ftag.enedis{background:var(--f-enedis-soft); color:var(--f-enedis)}
  .ftag.grdf{background:var(--f-grdf-soft); color:var(--f-grdf)}
  .pill{display:inline-block; padding:2px 8px; border-radius:11px; font-size:11px; font-weight:600; white-space:nowrap}
  .pill.ok{background:var(--ok-soft); color:var(--ok)}
  .pill.warn{background:var(--warn-soft); color:var(--warn)}
  .pill.crit{background:var(--crit-soft); color:var(--crit)}
  .pill.info{background:var(--info-soft); color:var(--info)}
  .pill.neutre{background:var(--surface-2); color:var(--ink-2); border:1px solid var(--rule)}
  .kv{font-family:"IBM Plex Mono",monospace; font-variant-numeric:tabular-nums}
  .ech{font-family:"IBM Plex Mono",monospace; font-size:12px}
  .ech .j{font-size:11px; color:var(--ink-3); display:block; margin-top:2px}
  .ech .j.crit{color:var(--crit); font-weight:600}
  .ech .j.warn{color:var(--warn); font-weight:600}
  .lieu{color:var(--ink-3); font-size:12px; margin-top:2px}
  .ref{font-family:"IBM Plex Mono",monospace; font-size:11px; color:var(--accent); font-weight:600}
  .prog{display:flex; gap:2px; margin-top:6px}
  .prog i{height:3px; flex:1; background:var(--rule); border-radius:2px}
  .prog i.on{background:var(--slate)}
  .prog i.cur{background:var(--accent)}

  /* fiche projet */
  .grid2{display:grid; grid-template-columns:minmax(300px,1.2fr) minmax(280px,1fr); gap:22px; align-items:start}
  @media(max-width:860px){ .grid2{grid-template-columns:1fr} }
  .synth{display:grid; grid-template-columns:repeat(auto-fit,minmax(220px,1fr)); gap:1px; background:var(--rule-2); border:1px solid var(--rule); border-radius:3px; overflow:hidden; margin-bottom:22px}
  .synth a{display:block; background:var(--surface); padding:13px 14px; text-decoration:none}
  .synth a:hover{background:var(--surface-2)}
  .synth .t{display:flex; justify-content:space-between; align-items:center; gap:8px; margin-bottom:8px}
  .synth .code{font-family:"IBM Plex Mono",monospace; font-size:11px; color:var(--accent); font-weight:600}
  .synth .next{font-family:"IBM Plex Mono",monospace; font-size:11.5px; color:var(--ink-2); margin-top:6px; line-height:1.4}
  .synth .next.crit{color:var(--crit)} .synth .next.warn{color:var(--warn)}
  .synth .vide{color:var(--ink-3); font-size:12.5px}
  .jal{list-style:none; margin:0; padding:0 16px}
  .jal li{display:flex; gap:11px; align-items:baseline; padding:8px 0; border-bottom:1px dashed var(--rule); flex-wrap:wrap}
  .jal li:last-child{border-bottom:0}
  .jal .dt{font-family:"IBM Plex Mono",monospace; font-size:11.5px; flex:0 0 82px; font-variant-numeric:tabular-nums}
  .jal .tx{flex:1; font-size:12.5px; color:var(--ink-2); min-width:200px}
  .jal li.fait .tx{color:var(--ink-3); text-decoration:line-through; text-decoration-thickness:1px}
  .jal .who{font-family:"IBM Plex Mono",monospace; font-size:10.5px; color:var(--ink-3)}
  .fichier{display:flex; gap:12px; align-items:center; padding:9px 16px; border-bottom:1px solid var(--rule-2); font-size:13px}
  .fichier:last-child{border-bottom:0}
  .fichier .ic{width:26px; height:32px; border:1px solid var(--rule); border-radius:2px; background:var(--surface-2); flex:0 0 26px; position:relative}
  .fichier .ic::after{content:"PDF"; position:absolute; bottom:3px; left:0; right:0; text-align:center; font-family:"IBM Plex Mono",monospace; font-size:7px; color:var(--ink-3); letter-spacing:.05em}
  .fichier .n{flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
  .fichier .m{font-family:"IBM Plex Mono",monospace; font-size:11px; color:var(--ink-3); white-space:nowrap}
  .depot{margin:10px 16px 14px; padding:14px; border:1px dashed var(--rule); border-radius:3px; text-align:center; color:var(--ink-3); font-size:12.5px}
  .journal td{font-size:12.5px}
  .journal .dt{font-family:"IBM Plex Mono",monospace; white-space:nowrap; font-size:11.5px}
  .journal .chg{font-family:"IBM Plex Mono",monospace; font-size:11.5px}
  .journal .chg s{color:var(--ink-3)}
  .journal .who{color:var(--ink-3); font-size:11.5px; white-space:nowrap}

  /* fiche demande */
  .champs{display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:10px 14px; padding:16px}
  .champs .sep{grid-column:1/-1; font-family:"IBM Plex Mono",monospace; font-size:10px; letter-spacing:.12em; text-transform:uppercase; color:var(--ink-3); border-top:1px dashed var(--rule); padding-top:8px; margin-top:4px}
  label{display:block; font-size:10.5px; letter-spacing:.06em; text-transform:uppercase; color:var(--ink-3); margin-bottom:3px; font-family:"IBM Plex Mono",monospace}
  input,select,textarea{width:100%; font:inherit; font-size:13px; padding:6px 8px; background:var(--surface); color:var(--ink); border:1px solid var(--rule); border-radius:2px}
  input:focus,select:focus,textarea:focus{outline:2px solid var(--accent); outline-offset:-1px; border-color:var(--accent)}
  textarea{min-height:70px; resize:vertical}
  .actions{display:flex; gap:8px; align-items:center; padding:0 16px 16px; flex-wrap:wrap}
  button,.btn{font:inherit; font-size:12.5px; font-weight:600; padding:7px 14px; border-radius:2px; border:1px solid var(--rule); background:var(--surface); color:var(--ink); cursor:pointer; text-decoration:none; display:inline-block}
  button:hover,.btn:hover{border-color:var(--ink-3)}
  button.primaire,a.btn.primaire{background:var(--accent); border-color:var(--accent); color:#fff}
  :root[data-theme="dark"] button.primaire,:root[data-theme="dark"] a.btn.primaire{color:#14100D}
  @media (prefers-color-scheme: dark){ :root:not([data-theme="light"]) button.primaire,:root:not([data-theme="light"]) a.btn.primaire{color:#14100D} }
  button:focus-visible,.btn:focus-visible,a:focus-visible{outline:2px solid var(--accent); outline-offset:2px}
  .etat{font-size:12px; color:var(--ink-3)}
  .pieces{font-size:12.5px; line-height:1.55; color:var(--ink-2); margin:0; padding:12px 16px 16px}
  .pieces b{color:var(--ink); font-weight:600}
  .toast{position:fixed; left:50%; bottom:22px; transform:translateX(-50%); background:var(--ink); color:var(--bg); padding:9px 16px; border-radius:3px; font-size:13px; box-shadow:0 8px 24px -8px rgba(0,0,0,.4); opacity:0; pointer-events:none; transition:opacity .2s}
  .toast.on{opacity:1}
  .note{margin-top:22px; padding:14px 16px; border-left:3px solid var(--accent); background:var(--surface); border-radius:0 3px 3px 0; color:var(--ink-2); font-size:12.5px; max-width:78ch}
  .note b{color:var(--ink)}
  .mail{padding:16px; font-family:"IBM Plex Mono",monospace; font-size:12px; line-height:1.6; color:var(--ink-2); white-space:pre-wrap}
  .mail b{color:var(--ink); font-weight:600}
  @media (prefers-reduced-motion:reduce){*{transition:none!important}}

.proto{display:none}
.err{background:var(--crit-soft); color:var(--crit); padding:10px 14px; border-radius:3px; margin-bottom:16px; font-size:13px}
.chargement{color:var(--ink-3); padding:40px; text-align:center}
.fichier a{text-decoration:none}
.fichier a:hover{color:var(--accent)}
.fichier button{padding:3px 8px; font-size:11px}
.depot{cursor:pointer}
.depot.on{border-color:var(--accent); color:var(--accent); background:var(--accent-soft)}
.depot select{width:auto; display:inline-block; margin-left:8px; font-size:12px; padding:3px 6px}
.ftag.natran{background:var(--f-grdf-soft); color:var(--f-grdf); outline:1px dashed var(--f-grdf); outline-offset:-1px}
/* sites, sources et fiche identite */
.fiche-g{padding:4px 16px 12px}
.fiche-g h3{font-family:"IBM Plex Mono",monospace; font-size:10px; letter-spacing:.12em; text-transform:uppercase; color:var(--ink-3); font-weight:500; border-top:1px dashed var(--rule); padding-top:10px; margin:10px 0 6px}
.fiche-g:first-child h3{border-top:0}
.fl{display:grid; grid-template-columns:minmax(150px,210px) 1fr minmax(120px,190px); gap:10px; align-items:center; padding:4px 0}
.fl label{margin:0; font-size:10.5px}
.fl .prov{font-size:11px; color:var(--ink-3); line-height:1.3; overflow:hidden; text-overflow:ellipsis}
.fl .prov a{text-decoration:none}
.fl.av input,.fl.av textarea{border-color:var(--warn); background:var(--warn-soft)}
.fl.mod input,.fl.mod textarea{border-color:var(--accent)}
.fl textarea{min-height:52px}
@media(max-width:700px){ .fl{grid-template-columns:1fr} }
.prop{display:grid; grid-template-columns:1fr auto; gap:12px; align-items:start; padding:10px 16px; border-bottom:1px solid var(--rule-2); font-size:12.5px}
.prop:last-child{border-bottom:0}
.prop .q{color:var(--ink-3); font-size:11.5px; margin-top:3px; line-height:1.4}
.prop .pb{display:flex; gap:6px}
.prop button{padding:3px 9px; font-size:11.5px}
.pret{display:grid; grid-template-columns:repeat(auto-fit,minmax(210px,1fr)); gap:1px; background:var(--rule-2); border-top:1px solid var(--rule)}
.pret>div{background:var(--surface); padding:12px 14px; font-size:12.5px}
.pret .t{display:flex; justify-content:space-between; align-items:center; margin-bottom:6px}
.pret .bar{height:4px; background:var(--rule); border-radius:2px; margin:6px 0 8px; overflow:hidden}
.pret .bar i{display:block; height:100%; background:var(--slate)}
.pret .bar i.ok{background:var(--ok)}
.pret .manq{color:var(--ink-3); font-size:11.5px; line-height:1.45}
.pret .canal{font-size:11px; color:var(--ink-3); margin-top:6px}
.src-st{font-family:"IBM Plex Mono",monospace; font-size:10.5px}
button:disabled,.btn[disabled]{opacity:.45; cursor:not-allowed}
pre.journal-robot{font-family:"IBM Plex Mono",monospace; font-size:11px; line-height:1.45; background:var(--surface-2); border:1px solid var(--rule); border-radius:2px; padding:8px 10px; max-height:260px; overflow:auto; white-space:pre-wrap; margin:6px 0 0; color:var(--ink-2)}
/* 0.3 : suivi des dossiers et des echanges */
.cellbtn .act{font-size:11px; line-height:1.3; color:var(--ink-2); max-width:170px; text-align:center}
.cellbtn .act.crit{color:var(--crit); font-weight:600}
.cellbtn .act.warn{color:var(--warn); font-weight:600}
.cellbtn .act.attente{color:var(--ink-3); font-style:italic}
.cellbtn .act.fait{color:var(--ink-3)}
.cellbtn .mailb{font-family:"IBM Plex Mono",monospace; font-size:10.5px; color:var(--warn)}
.cellbtn.so{border-style:dotted; color:var(--ink-3); background:var(--surface-2); font-size:11.5px}
.cellsub{display:block; margin-top:3px; font-size:10.5px; color:var(--ink-3); text-decoration:none}
.cellsub:hover{color:var(--accent)}
td.ech-col{font-size:12px; min-width:170px}
td.ech-col .o{color:var(--ink-2); overflow:hidden; text-overflow:ellipsis; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical}
.actbox{padding:12px 16px; display:flex; gap:12px; align-items:baseline; flex-wrap:wrap; border-left:3px solid var(--slate)}
.actbox.crit{border-left-color:var(--crit)} .actbox.warn{border-left-color:var(--warn)} .actbox.attente{border-left-color:var(--rule)}
.actbox .t{font-weight:600; flex:1; min-width:220px}
.actbox .s{font-family:"IBM Plex Mono",monospace; font-size:10.5px; color:var(--ink-3); text-transform:uppercase; letter-spacing:.08em}
.fil-ech{list-style:none; margin:0; padding:0}
.fil-ech li{padding:10px 16px; border-bottom:1px solid var(--rule-2); display:grid; grid-template-columns:86px 1fr auto; gap:12px; align-items:start}
.fil-ech li:last-child{border-bottom:0}
.fil-ech .dt{font-family:"IBM Plex Mono",monospace; font-size:11.5px; color:var(--ink-2)}
.fil-ech .dt small{display:block; color:var(--ink-3); font-size:10.5px}
.fil-ech .ob{font-weight:600; font-size:13px}
.fil-ech .mt{font-size:11.5px; color:var(--ink-3); margin-top:2px}
.fil-ech .rs{font-size:12.5px; color:var(--ink-2); margin-top:6px; white-space:pre-wrap; max-height:7.5em; overflow:hidden}
.fil-ech .bt{display:flex; flex-direction:column; gap:4px; align-items:flex-end}
.fil-ech .bt button{padding:3px 8px; font-size:11px; white-space:nowrap}
.sens{display:inline-block; font-family:"IBM Plex Mono",monospace; font-size:10px; letter-spacing:.08em; text-transform:uppercase; padding:1px 6px; border-radius:2px; font-weight:600; margin-right:6px}
.sens.envoye{background:var(--info-soft); color:var(--info)}
.sens.recu{background:var(--ok-soft); color:var(--ok)}
.sens.note{background:var(--surface-2); color:var(--ink-2); border:1px solid var(--rule)}
@media(max-width:700px){ .fil-ech li{grid-template-columns:1fr} .fil-ech .bt{flex-direction:row; align-items:center} }
details.ajout{border-top:1px solid var(--rule)}
details.ajout summary{cursor:pointer; padding:10px 16px; font-size:12.5px; font-weight:600; color:var(--accent); list-style:none}
details.ajout summary::-webkit-details-marker{display:none}
details.ajout[open] summary{border-bottom:1px dashed var(--rule)}
.chk{display:flex; gap:6px; align-items:center; font-size:12.5px; color:var(--ink-2); padding-top:18px}
.chk input{width:auto}
.chips{display:flex; gap:6px; flex-wrap:wrap}
.chip{padding:4px 10px; font-size:12px; border-radius:12px}
.chip.on{background:var(--ink); color:var(--bg); border-color:var(--ink)}
.backend{padding:12px 16px; font-size:12.5px; color:var(--ink-2); line-height:1.55}
/* 0.4 : commentaires, points a verifier, documents, robot */
.fl{grid-template-columns:minmax(150px,210px) 1fr minmax(120px,190px) 26px}
.fl .flag{padding:2px 0; width:26px; font-size:13px; line-height:1; border-color:transparent; background:transparent; color:var(--ink-3)}
.fl .flag:hover{color:var(--accent); border-color:var(--rule)}
.fl.sig .flag{color:var(--accent)}
.fl.sig label{color:var(--accent)}
.fl.sig input,.fl.sig textarea{outline:1.5px solid var(--accent); outline-offset:1px}
.fl-sig{grid-column:1/-1; margin:2px 0 6px; padding:7px 10px; background:var(--accent-soft); border-radius:2px; font-size:12px; color:var(--ink-2); display:flex; gap:8px; align-items:center; flex-wrap:wrap}
.fl-sig[hidden]{display:none}
.fl-sig b{color:var(--accent)}
.fl .fl-sig input{background:var(--surface); border-color:var(--rule); outline:none}
.fl-sig input{flex:1; min-width:180px; padding:4px 7px; font-size:12px}
.fl-sig button{padding:3px 9px; font-size:11.5px}
@media(max-width:700px){ .fl{grid-template-columns:1fr 26px} .fl label,.fl .prov{grid-column:1/-1} }
.coms{list-style:none; margin:0; padding:0}
.coms li{padding:11px 16px; border-bottom:1px solid var(--rule-2); display:grid; grid-template-columns:1fr auto; gap:10px}
.coms li:last-child{border-bottom:0}
.coms li.pt{border-left:3px solid var(--accent); background:linear-gradient(90deg,var(--accent-soft),transparent 60%)}
.coms li.pt.ok{border-left-color:var(--ok); background:none}
.coms .meta{font-family:"IBM Plex Mono",monospace; font-size:10.5px; color:var(--ink-3)}
.coms .tx{font-size:13px; margin-top:3px; white-space:pre-wrap}
.coms .rep{font-size:12px; color:var(--ok); margin-top:4px}
.coms .cib{display:inline-block; font-size:10.5px; font-family:"IBM Plex Mono",monospace; color:var(--accent); border:1px solid var(--accent); border-radius:2px; padding:0 5px; margin-right:6px}
.coms .bt{display:flex; flex-direction:column; gap:4px; align-items:flex-end}
.coms .bt input{width:170px; padding:3px 6px; font-size:11.5px}
.coms .bt button{padding:3px 8px; font-size:11px; white-space:nowrap}
.ptchip{display:inline-block; margin-top:5px; font-family:"IBM Plex Mono",monospace; font-size:10.5px; color:var(--accent); text-decoration:none; border:1px solid var(--accent); border-radius:2px; padding:0 5px}
.res{display:grid; grid-template-columns:1fr auto; gap:6px 12px; padding:10px 16px; border-bottom:1px solid var(--rule-2); align-items:start}
.res:last-child{border-bottom:0}
.res .l{font-weight:600; font-size:13px}
.res .l a{text-decoration:none; color:var(--accent)}
.res .l a:hover{text-decoration:underline}
.res .n{font-size:12px; color:var(--ink-2); margin-top:2px}
.res .m{font-family:"IBM Plex Mono",monospace; font-size:10.5px; color:var(--ink-3); margin-top:3px}
.res .bt{display:flex; gap:4px; align-items:center}
.res .bt button{padding:3px 8px; font-size:11px}
.res.cur{background:var(--surface-2)}
.d1 table td{padding:6px 12px; font-size:12.5px}
.d1 td.q{color:var(--ink-2)}
.d1 td.v{font-family:"IBM Plex Mono",monospace; font-size:12px; word-break:break-word}
.d1 tr.manque td.v{color:var(--crit); font-weight:600}
.d1 tr.et td{background:var(--surface-2); font-family:"IBM Plex Mono",monospace; font-size:10px; letter-spacing:.12em; text-transform:uppercase; color:var(--ink-3)}
.cmd{display:flex; gap:8px; align-items:center; margin:12px 16px; padding:9px 12px; background:var(--nav); color:var(--nav-ink); border-radius:3px; font-family:"IBM Plex Mono",monospace; font-size:12px; overflow-x:auto}
.cmd{overflow:hidden}
.cmd code{flex:1; min-width:0; white-space:nowrap; overflow-x:auto}
.cmd button{flex:0 0 auto}
.cmd button{padding:3px 9px; font-size:11px; background:transparent; color:var(--nav-ink); border-color:var(--nav-ink-2)}
.backend code{font-family:"IBM Plex Mono",monospace; font-size:11.5px; background:var(--surface-2); padding:1px 5px; border-radius:2px}
</style>
</head>
<body>
<div class="topbar"><div class="in">
  <div class="logo"><span id="enseigne">Castignac</span> <small>Amont</small></div>
  <nav class="menu" id="menu">
    <a href="#/" data-r="accueil">Tableau de bord</a>
    <a href="#/sites" data-r="sites" title="Sites et sources">Sites</a>
    <a href="#/projets" data-r="projets">Projets</a>
    <a href="#/demandes" data-r="demandes">Demandes</a>
    <a href="#/mails" data-r="mails">Mails</a>
    <a href="#/contacts" data-r="contacts">Contacts</a>
    <a href="#/verifier" data-r="verifier">À vérifier<span class="badge" id="nb-verif" hidden></span></a>
    <a href="#/documents" data-r="documents">Documents</a>
    <a href="#/journal" data-r="journal">Journal</a>
    <a href="#/alerte" data-r="alerte">Alertes</a>
  </nav>
  <div class="who" id="who"><label for="moi" style="margin:0;color:var(--nav-ink-2)">Vous</label><input id="moi" list="liste-moi" placeholder="votre nom" autocomplete="off"><datalist id="liste-moi"></datalist></div>
</div></div>

<div class="wrap" id="app"><div class="chargement">Chargement du registre…</div></div>
<div class="toast" id="toast"></div>

<script>
(function(){
  "use strict";
  /* ---------- API ---------- */
  function lireMoi(){ try{ return localStorage.getItem("amont_auteur")||""; }catch(e){ return ""; } }
  function entetes(json){ const h={}; if(json) h["Content-Type"]="application/json"; const m=lireMoi(); if(m) h["X-Amont-Auteur"]=encodeURIComponent(m); return h; }
  async function api(chemin, options){
    const r = await fetch("/api"+chemin, Object.assign({headers:entetes(true)}, options||{}));
    if(r.status===204) return null;
    const ct=r.headers.get("content-type")||"";
    const corps = ct.includes("json") ? await r.json() : await r.text();
    if(!r.ok){ const m=(corps&&corps.erreur)||(corps&&corps.detail&&JSON.stringify(corps.detail))||("erreur "+r.status); throw new Error(m); }
    return corps;
  }
  let REF=null, MOI="";

  /* ---------- utilitaires ---------- */
  const $=s=>document.querySelector(s);
  const esc=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
  const nb=v=>(v==null||v==="")?"—":Number(v).toLocaleString("fr-FR",{maximumFractionDigits:0});
  const fmt=s=>{ if(!s) return ""; const [a,m,j]=s.slice(0,10).split("-"); return j+"/"+m+"/"+a; };
  const F=f=>REF.filieres[f]||REF.filieres.rte_ee;
  const classePill=s=>{ if(["etude_recue","ptf_recue","file_attente","convention","pdr_recue","acceptee","mise_en_service","devis_recu","accepte","clos"].includes(s)) return "ok"; if(s==="pret_validation") return "warn"; if(s==="irrecevable") return "crit"; if(["depose","recevable","confirmation_demandee","qualifiee","travaux"].includes(s)) return "info"; return "neutre"; };
  function toast(t){ const el=$("#toast"); el.textContent=t; el.classList.add("on"); setTimeout(()=>el.classList.remove("on"),2600); }
  function head(t,sub,tot){ return '<div class="pagehead"><div><h1>'+t+'</h1>'+(sub?'<p class="sub">'+sub+'</p>':'')+'</div>'+(tot||'')+'</div>'; }
  function crumbs(parts){ return '<div class="crumbs">'+parts.map(p=>p.href?'<a href="'+p.href+'">'+esc(p.l)+'</a>':esc(p.l)).join(' › ')+'</div>'; }
  function echHtml(pe){ if(!pe) return "—"; const s=pe.jours<0?"crit":(pe.jours<=14?"warn":""); return '<div class="ech">'+fmt(pe.date)+'<span class="j '+s+'">'+(pe.jours<0?("dépassée de "+(-pe.jours)+" j"):("dans "+pe.jours+" j"))+' · '+esc(pe.libelle.split(",")[0])+'</span></div>'; }
  function idx(d){ return F(d.filiere).etapes.findIndex(e=>e.cle===d.statut); }
  function journalRows(list, avecDemande){
    if(!list.length) return '<tr><td class="etat">Aucun changement enregistré.</td></tr>';
    return list.map(j=>'<tr><td class="dt">'+esc(j.horodatage)+'</td>'+(avecDemande?'<td>'+(j.demande_id?'<a class="ref" href="#/demande/'+esc(j.demande_id)+'" style="text-decoration:none">'+esc(j.demande_id)+'</a>':'')+'</td>':'')+'<td class="chg">'+esc(j.champ)+' : '+(j.avant?'<s>'+esc(j.avant)+'</s> → ':'')+esc(j.apres)+'</td><td class="who">'+esc(j.auteur)+' · '+esc(j.origine)+'</td></tr>').join("");
  }
  function lignesDemandes(list, projets){
    return list.map(d=>{ const f=F(d.filiere), i=idx(d);
      const prog='<div class="prog">'+f.etapes.map((e,k)=>'<i class="'+(i<0?"":(k<i?"on":(k===i?"cur":"")))+'"></i>').join("")+'</div>';
      let sup=""; if(d.domaine) sup='<div class="lieu kv">'+d.domaine.n+' · '+d.domaine.u+'</div>';
      return '<tr class="lien" data-href="#/demande/'+esc(d.id)+'"><td><div class="projname">'+esc(d.site||(projets[d.projet_code]||d.projet_code))+'</div><div class="lieu">'+esc([d.commune,d.departement].filter(Boolean).join(" · "))+'</div>'+prog+'</td>'+
        '<td><span class="ftag '+d.filiere+'">'+f.court+'</span></td><td><span class="ref">'+esc(d.num_etude||d.ref_dossier||d.id)+'</span></td>'+
        '<td class="num kv">'+esc(d.dimension||"—")+sup+'</td><td><span class="pill '+classePill(d.statut)+'">'+esc(d.libelle_statut)+'</span></td><td>'+echHtml(d.prochaine_echeance)+'</td>'+
        '<td class="num kv">'+(d.cout_client_keur?nb(d.cout_client_keur)+' k€':'—')+'</td></tr>'; }).join("");
  }
  const enteteListe='<thead><tr><th>Site</th><th>Filière</th><th>Réf.</th><th class="num">Dimension</th><th>Étape</th><th>Prochaine échéance</th><th class="num">Coût client</th></tr></thead>';
  const court=(t,n)=>{ t=String(t||""); return t.length>n?t.slice(0,n-1).trimEnd()+"…":t; };
  const cellule=d=>{ const pe=d.prochaine_echeance; let e; if(pe){ const s=pe.jours<0?"crit":(pe.jours<=14?"warn":""); e='<span class="e '+s+'">'+(pe.jours<0?("dépassée "+(-pe.jours)+" j"):("J-"+pe.jours))+'</span>'; } else e='<span class="e">'+esc(d.dimension||"")+'</span>';
    const a=d.action||{}; const att=d.echanges_resume&&d.echanges_resume.attente;
    return '<a class="cellbtn" href="#/demande/'+esc(d.id)+'" title="'+esc(a.texte||"")+'"><span class="pill '+classePill(d.statut)+'">'+esc(d.libelle_statut)+'</span>'+(a.texte?'<span class="act '+(a.niveau||"")+'">'+esc(court(a.texte,64))+'</span>':'')+e+(att?'<span class="mailb">✉ sans réponse '+att.jours+' j</span>':'')+'</a>'; };
  function echCol(r){ if(!r||!r.dernier) return '<span class="etat">Aucun échange</span>'; const d=r.dernier;
    return '<div class="kv" style="font-size:11px">'+fmt(d.date)+' · <span class="sens '+d.sens+'">'+esc(d.libelle_sens)+'</span></div><div class="o">'+esc(d.objet||"(sans objet)")+'</div>'+(r.nb_attente?'<div class="kv" style="font-size:11px;color:var(--warn);margin-top:2px">'+r.nb_attente+' sans réponse'+(r.attente?', depuis '+r.attente.jours+' j':'')+'</div>':''); }
  function echangesHtml(list, opts){ opts=opts||{};
    if(!list.length) return '<p class="pieces">Aucun échange enregistré.</p>';
    return '<ul class="fil-ech">'+list.map(e=>'<li><div class="dt">'+fmt(e.date)+'<small>'+esc((e.date||"").slice(11,16))+' · '+esc(e.libelle_canal)+'</small></div><div><div class="ob"><span class="sens '+e.sens+'">'+esc(e.libelle_sens)+'</span>'+esc(e.objet||"(sans objet)")+'</div>'+
      '<div class="mt">'+(e.contact_nom?esc(e.contact_nom)+(e.contact_organisation?' ('+esc(e.contact_organisation)+')':''):esc(e.sens==="recu"?e.expediteur:e.destinataires))+(opts.avecDemande?(e.demande_id?' · <a class="ref" href="#/demande/'+esc(e.demande_id)+'" style="text-decoration:none">'+esc(e.demande_id)+'</a>':' · <a class="ref" href="#/projet/'+esc(e.projet_code)+'" style="text-decoration:none">'+esc(e.projet_code)+'</a>'):'')+
      (e.attend_reponse?' · <b style="color:var(--warn)">sans réponse depuis '+e.jours_attente+' j</b>'+(e.relance_le?' · relance le '+fmt(e.relance_le):''):(e.repondu_le&&e.sens==="envoye"?' · répondu le '+fmt(e.repondu_le):''))+(e.fichier?' · <a href="/api/echanges/'+e.id+'/fichier">.eml</a>':'')+'</div>'+
      (e.resume?'<div class="rs">'+esc(e.resume)+'</div>':'')+'</div><div class="bt">'+
      (e.sens==="envoye"?(e.attend_reponse?'<button data-action="clore-attente" data-ech="'+e.id+'">Réponse reçue</button>':'<button data-action="rouvrir-attente" data-ech="'+e.id+'">Attendre une réponse</button>'):'')+
      '<button data-action="supprimer-echange" data-ech="'+e.id+'" title="Retirer">×</button></div></li>').join("")+'</ul>'; }
  function commentairesHtml(list, opts){ opts=opts||{};
    if(!list.length) return '<p class="pieces">'+(opts.vide||"Aucun commentaire.")+'</p>';
    const pts=list.filter(c=>c.a_verifier&&c.statut==="ouvert"), autres=list.filter(c=>!(c.a_verifier&&c.statut==="ouvert"));
    return '<ul class="coms">'+pts.concat(autres).map(c=>{ const pt=c.a_verifier, ok=c.statut==="verifie";
      return '<li class="'+(pt?"pt"+(ok?" ok":""):"")+'"><div><div class="meta">'+esc(c.auteur||"interne")+' · '+esc((c.cree_le||"").slice(0,16))+(opts.avecProjet?' · <a class="ref" href="#/projet/'+esc(c.projet_code)+'" style="text-decoration:none">'+esc(c.projet_nom||c.projet_code)+'</a>':'')+(c.demande_id?' · <a class="ref" href="#/demande/'+esc(c.demande_id)+'" style="text-decoration:none">'+esc(c.demande_id)+'</a>':'')+(pt?(ok?' · <span style="color:var(--ok)">vérifié par '+esc(c.traite_par||"")+' le '+fmt(c.traite_le)+'</span>':' · <b style="color:var(--accent)">à vérifier</b>'):'')+'</div>'+
        '<div class="tx">'+(c.libelle_cible?(c.cible&&c.cible.startsWith("fiche:")?'<a class="cib" href="#/site/'+esc(c.projet_code)+'" style="text-decoration:none">'+esc(c.libelle_cible)+'</a>':'<span class="cib">'+esc(c.libelle_cible)+'</span>'):'')+esc(c.texte)+'</div>'+(c.reponse?'<div class="rep">↳ '+esc(c.reponse)+'</div>':'')+'</div>'+
        '<div class="bt">'+(pt&&!ok?'<input placeholder="réponse (facultatif)" id="rep-'+c.id+'"><button class="primaire" data-action="verifier-point" data-com="'+c.id+'">Vérifié</button>':'')+(pt&&ok?'<button data-action="rouvrir-point" data-com="'+c.id+'">Rouvrir</button>':'')+'<button data-action="supprimer-com" data-com="'+c.id+'" title="Retirer">×</button></div></li>'; }).join("")+'</ul>'; }
  function formCommentaire(o){
    return '<details class="ajout"'+(o.ouvert?' open':'')+'><summary>+ Commenter, ou signaler un point à faire vérifier</summary><div class="champs" id="form-com"><div style="grid-column:1/-1"><label for="com-texte">Commentaire</label><textarea id="com-texte"></textarea></div>'+
      (o.demandes&&o.demandes.length?'<div><label for="com-demande">Demande concernée</label><select id="com-demande"><option value="">Projet en général</option>'+o.demandes.map(d=>'<option value="'+esc(d.id)+'"'+(d.id===o.demande?' selected':'')+'>'+esc(d.id)+' · '+esc(F(d.filiere).court)+'</option>').join("")+'</select></div>':'')+
      '<label class="chk"><input type="checkbox" id="com-verif"'+(o.verif?' checked':'')+'> À faire vérifier (apparaît dans « À vérifier »)</label></div><div class="actions"><button class="primaire" data-action="creer-com" data-projet="'+esc(o.projet)+'" data-demande="'+esc(o.demande||"")+'">Publier</button><span class="etat">Signé '+esc(lireMoi()||"interne")+'. Pour un champ précis de la fiche, utilisez le ⚑ à côté du champ.</span></div></details>'; }
  function ressourcesHtml(list, etapeCourante){
    if(!list.length) return '<p class="pieces">Aucun document ni lien pour cette étape. <a href="#/documents">En ajouter</a>.</p>';
    return list.map(r=>'<div class="res'+(r.etape&&r.etape===etapeCourante?' cur':'')+'"><div><div class="l">'+(r.url?'<a href="'+esc(r.url)+'" target="_blank" rel="noopener">'+esc(r.libelle)+' ↗</a>':esc(r.libelle))+'</div>'+(r.notes?'<div class="n">'+esc(r.notes)+'</div>':'')+
      '<div class="m">'+esc((REF.types_ressource||{})[r.type]||r.type)+(r.filiere==="commun"?' · toutes filières':'')+(r.etape?' · étape '+esc(etapeLib(r.filiere,r.etape)):' · toutes étapes')+(r.verifie_le?' · lien vérifié le '+fmt(r.verifie_le):' · lien non vérifié')+'</div></div>'+
      '<div class="bt">'+(r.fichier?'<a class="btn" style="padding:3px 8px;font-size:11px" href="/api/ressources/'+r.id+'/fichier">'+esc(r.nom_fichier||"fichier")+'</a>':'')+'</div></div>').join(""); }
  function etapeLib(f,e){ if(!e) return "toutes"; const ff=REF.filieres[f]; if(!ff) return e; const x=ff.etapes.find(z=>z.cle===e); return x?x.libelle:(REF.hors_chaine[e]||e); }
  const ROBOT_ST={en_attente:["warn","en attente de l'agent"],en_cours:["info","en cours"],terminee:["ok","terminé"],erreur:["crit","arrêté"],annulee:["neutre","annulé"]};
  function lancementHtml(d, pl){
    const va=(d.validation||{}).etat, ok=!REF.validation||!REF.validation.requise||va==="validee";
    return '<div class="actions" style="padding-top:14px"><button data-action="robot" data-id="'+esc(d.id)+'" data-mode="banc">Banc d\'essai</button>'+
      '<button data-action="robot" data-id="'+esc(d.id)+'" data-mode="portail" data-jusqua="2" title="Vrai portail, étapes 1 et 2, pour tester sans validation">Portail, étapes 1 et 2</button>'+
      '<button class="primaire" data-action="robot" data-id="'+esc(d.id)+'" data-mode="portail" data-jusqua="5"'+(ok&&pl.pret?'':' disabled')+' title="'+(ok?(pl.pret?'Remplit les 4 étapes et s\'arrête avant la certification':'Formulaire incomplet'):'Validation du responsable nécessaire')+'">Pré-remplir le portail RTE</button></div>'; }
  function lancementEnedisHtml(d, pl){
    const va=(d.validation||{}).etat, ok=!REF.validation||!REF.validation.requise||va==="validee";
    return '<div class="actions" style="padding-top:14px"><button data-action="robot" data-id="'+esc(d.id)+'" data-mode="portail" data-jusqua="1" title="Vrai portail, étape Coordonnées seulement ; le portail garde un brouillon">Portail, étape 1</button>'+
      '<button class="primaire" data-action="robot" data-id="'+esc(d.id)+'" data-mode="portail" data-jusqua="4"'+(ok&&pl.pret?'':' disabled')+' title="'+(ok?(pl.pret?'Remplit les 4 étapes et s\'arrête sur Échéance, sans envoyer':'Formulaire incomplet'):'Validation du responsable nécessaire')+'">Pré-remplir le portail Enedis</button></div>'; }
  function planEnedisHtml(pl){
    let h='<div class="backend">'+(pl.pret?'<span class="pill ok">prête pour le robot</span> Toutes les valeurs obligatoires sont là.':'<span class="pill crit">incomplète</span> Manque : '+esc(pl.manquants.join(" ; ")))+(pl.alertes.length?'<br><span class="pill warn">attention</span> '+esc(pl.alertes.join(" ; ")):'')+'</div>';
    if(!pl.etapes.length) return h;
    const n=pl.etapes.reduce((k,e)=>k+e.actions.length,0);
    h+='<details class="ajout"><summary>Voir les '+n+' saisies prévues sur le portail Enedis</summary><div class="d1 tbl-scroll"><table><tbody>'+

  async function deposerSources(code, fichiers){
    const fd=new FormData(); [...fichiers].forEach(f=>fd.append("fichiers",f));
    toast("Envoi de "+fichiers.length+" fichier"+(fichiers.length>1?"s":"")+"…");
    try{ const r=await fetch("/api/sites/"+encodeURIComponent(code)+"/sources",{method:"POST",body:fd,headers:entetes(false)}); if(!r.ok){ const j=await r.json().catch(()=>({})); throw new Error(j.erreur||("erreur "+r.status)); } toast("Fichiers déposés, lecture en cours."); route(); }
    catch(e){ toast(e.message); }
  }

      if(a==="supprimer-echange"){ if(btn.dataset.arme!=="1"){ btn.dataset.arme="1"; btn.textContent="Confirmer"; setTimeout(()=>{btn.dataset.arme="";btn.textContent="×";},4000); return; } await api("/echanges/"+btn.dataset.ech,{method:"DELETE"}); toast("Échange retiré."); route(); }
      if(a==="sans-objet"){ const motif=prompt("Pourquoi cette filière est sans objet pour ce site ? (facultatif)",""); if(motif===null) return; await api("/projets/"+encodeURIComponent(btn.dataset.code)+"/filieres/"+btn.dataset.filiere,{method:"PUT",body:JSON.stringify({etat:"sans_objet",motif:motif})}); toast("Filière marquée sans objet."); route(); }
      if(a==="a-suivre"){ await api("/projets/"+encodeURIComponent(btn.dataset.code)+"/filieres/"+btn.dataset.filiere,{method:"PUT",body:JSON.stringify({etat:null})}); toast("Filière remise à suivre."); route(); }
      if(a==="editer-contact"){ const c=(window.__contacts||[]).find(x=>String(x.id)===btn.dataset.contact); if(!c) return; document.querySelectorAll("#form-contact [data-c]").forEach(el=>el.value=c[el.dataset.c]||""); $("[data-action=sauver-contact]").dataset.contact=c.id; $("#titre-contact").textContent="Modifier "+c.nom; $("#c-nom").focus(); }
      if(a==="vider-contact"){ document.querySelectorAll("#form-contact [data-c]").forEach(el=>el.value=""); $("[data-action=sauver-contact]").dataset.contact=""; $("#titre-contact").textContent="Nouveau contact"; }
      if(a==="sauver-contact"){ const o={}; document.querySelectorAll("#form-contact [data-c]").forEach(el=>o[el.dataset.c]=el.value.trim()); if(!o.nom){ toast("Le nom est obligatoire."); return; }
        if(btn.dataset.contact) await api("/contacts/"+btn.dataset.contact,{method:"PATCH",body:JSON.stringify(o)}); else await api("/contacts",{method:"POST",body:JSON.stringify(o)}); toast("Contact enregistré."); route(); }
      if(a==="supprimer-contact"){ if(btn.dataset.arme!=="1"){ btn.dataset.arme="1"; btn.textContent="Confirmer"; setTimeout(()=>{btn.dataset.arme="";btn.textContent="×";},4000); return; } await api("/contacts/"+btn.dataset.contact,{method:"DELETE"}); toast("Contact retiré, ses échanges restent."); route(); }
      if(a==="retirer-piece"){ await api("/pieces/"+btn.dataset.piece,{method:"DELETE"}); toast("Pièce retirée."); route(); }
    }catch(e){ if(msg) msg.textContent=e.message; toast(e.message); }
  }
  function remplirEtapes(f, val){ const sel=$("#r-etape"); if(!sel) return; const ff=REF.filieres[f==="commun"?"rte_ee":f]||REF.filieres.rte_ee; sel.innerHTML='<option value="">Toutes les étapes</option>'+ff.etapes.map(e=>'<option value="'+e.cle+'">'+esc(e.libelle)+'</option>').join(""); sel.value=val||""; }
  async function joindreRessource(rid, fichier){
    const fd=new FormData(); fd.append("fichier",fichier);
    try{ const r=await fetch("/api/ressources/"+rid+"/fichier",{method:"POST",body:fd,headers:entetes(false)}); if(!r.ok){ const j=await r.json().catch(()=>({})); throw new Error(j.erreur||("erreur "+r.status)); } toast("Document joint."); route(true); }
    catch(e){ toast(e.message); } }
  const PREP_ST={en_cours:["info","en cours…"],fait:["ok","fait"],deja:["neutre","déjà fait"],ignore:["neutre","sans objet"],erreur:["crit","erreur"]};
  let prepId=null;
  async function suivrePrep(id){ prepId=id; const zone=$("#prep"); if(!zone) return;
    let t; try{ t=await api("/taches/"+id); }catch(e){ zone.innerHTML='<div class="err">'+esc(e.message)+'</div>'; return; }
    zone.innerHTML='<div class="bloc"><div class="bloc-head"><h2>Préparation du site</h2><span class="pill '+(t.fini?"ok":"info")+'">'+(t.fini?"terminée":"en cours, 1 à 5 min")+'</span></div><ul class="jal">'+
      t.etapes.map(e=>{ const st=PREP_ST[e.statut]||["neutre",e.statut]; return '<li><span class="pill '+st[0]+'" style="flex:0 0 auto">'+st[1]+'</span><span class="tx"><b>'+esc(e.nom)+'</b>'+(e.detail?' · '+esc(e.detail):'')+'</span></li>'; }).join("")+'</ul>'+
      (t.fini?'<div class="actions"><button data-action="fermer-prep">Fermer</button><span class="etat">La fiche ci-dessous est à jour : valeurs surlignées à vérifier, puis demande de validation sur la fiche de la demande.</span></div>':'')+'</div>';
    if(!t.fini) setTimeout(()=>{ if(prepId===id && $("#prep")) suivrePrep(id); },2000);
    else if(!zone.dataset.rafraichi){ zone.dataset.rafraichi="1"; const html=zone.innerHTML; await route(true); const z=$("#prep"); if(z){ z.innerHTML=html; z.dataset.rafraichi="1"; } }
  }
  async function deposerEml(zone, fichiers){
    const fd=new FormData(); [...fichiers].forEach(f=>fd.append("fichiers",f));
    let proj=zone.dataset.projet, dem=zone.dataset.demande;
    if(!proj && !dem){ const sp=$("#e-projet"), sd=$("#e-demande"); if(sp&&sp.value) proj=sp.value; if(sd&&sd.value) dem=sd.value; }
    if(proj) fd.append("projet_code",proj); if(dem) fd.append("demande_id",dem);
    toast("Lecture de "+fichiers.length+" courriel"+(fichiers.length>1?"s":"")+"…");
    try{ const r=await fetch("/api/echanges/eml",{method:"POST",body:fd,headers:entetes(false)}); const j=await r.json().catch(()=>({})); if(!r.ok) throw new Error(j.erreur||("erreur "+r.status));
      const n=j.crees.filter(e=>!e.doublon).length, dbl=j.crees.length-n;
      let t=n+" courriel"+(n>1?"s":"")+" enregistré"+(n>1?"s":"")+(dbl?", "+dbl+" déjà présent"+(dbl>1?"s":""):"");
      if(j.refuses.length) t+=" · refusé : "+j.refuses.map(x=>(x.objet||x.fichier)+" ("+x.motif+")").join(" ; ");
      toast(t); route(); }
    catch(e){ toast(e.message); }
  }
  async function deposer(id, fichier){
    const fd=new FormData(); fd.append("fichier",fichier); fd.append("type",$("#type-piece").value);
    try{ const r=await fetch("/api/demandes/"+encodeURIComponent(id)+"/pieces",{method:"POST",body:fd,headers:entetes(false)}); if(!r.ok){ const j=await r.json().catch(()=>({})); throw new Error(j.erreur||("erreur "+r.status)); } toast("Pièce ajoutée."); route(); }
    catch(e){ toast(e.message); }
  }

  document.addEventListener("click",ev=>{
    const t=ev.target.closest("[data-toast]"); if(t){ ev.preventDefault(); toast(t.dataset.toast); return; }
    const b=ev.target.closest("[data-action]"); if(b){ ev.preventDefault(); action(b); return; }
    const c=ev.target.closest("[data-filtre]"); if(c){ filtre=c.dataset.filtre; route(); return; }
    const fm=ev.target.closest("[data-fmail]"); if(fm){ filtreMails=fm.dataset.fmail; route(); return; }
    const det=ev.target.closest("#depot-etude"); if(det){ $("#fichier-etude").click(); return; }
    const de=ev.target.closest("#depot-eml"); if(de && !ev.target.closest("a")){ $("#fichiers-eml").click(); return; }
    const dz=ev.target.closest("#depot"); if(dz && !ev.target.closest("select")){ $("#fichier-piece").click(); return; }
    const ds=ev.target.closest("#depot-src"); if(ds){ $("#fichiers-src").click(); return; }
    const tr=ev.target.closest("tr.lien"); if(tr && !ev.target.closest("a,button")){ location.hash=tr.dataset.href; }
  });
  document.addEventListener("change",ev=>{ if(ev.target.id==="fichier-piece" && ev.target.files[0]) deposer($("#depot").dataset.id, ev.target.files[0]);
    if(ev.target.id==="fichiers-src" && ev.target.files.length) deposerSources($("#depot-src").dataset.code, ev.target.files);
    if(ev.target.id==="fichier-etude" && ev.target.files[0]) deposerEtude($("#depot-etude").dataset.id, ev.target.files[0]);
    if(ev.target.id==="fichiers-eml" && ev.target.files.length) deposerEml($("#depot-eml"), ev.target.files);
    if(ev.target.id==="fichier-res" && ev.target.files[0]) joindreRessource(ev.target.dataset.rid, ev.target.files[0]);
    if(ev.target.id==="r-filiere") remplirEtapes(ev.target.value, "");
    if(ev.target.id==="moi"){ const v=ev.target.value.trim(); try{ localStorage.setItem("amont_auteur", v); }catch(e){} MOI=v||"interne"; toast(v?"Vos modifications seront signées « "+v+" ».":"Modifications signées « interne »."); route(true); }
    if(ev.target.id==="e-sens"){ const ch=$("#e-attend"); if(ch) ch.checked=ev.target.value==="envoye"; }
    if(ev.target.dataset && ev.target.dataset.fk!==undefined){ ev.target.closest(".fl").classList.toggle("mod", ev.target.value!==ev.target.dataset.orig); } });
  document.addEventListener("input",ev=>{ if(ev.target.dataset && ev.target.dataset.fk!==undefined){ ev.target.closest(".fl").classList.toggle("mod", ev.target.value!==ev.target.dataset.orig); } });
  document.addEventListener("dragover",ev=>{ const dz=ev.target.closest("#depot,#depot-src,#depot-eml,#depot-etude"); if(dz){ ev.preventDefault(); dz.classList.add("on"); } });
  document.addEventListener("dragleave",ev=>{ const dz=ev.target.closest("#depot,#depot-src,#depot-eml,#depot-etude"); if(dz) dz.classList.remove("on"); });
  document.addEventListener("drop",ev=>{ const dz=ev.target.closest("#depot,#depot-src,#depot-eml,#depot-etude"); if(dz){ ev.preventDefault(); dz.classList.remove("on");
    if(dz.id==="depot-etude"){ if(ev.dataTransfer.files[0]) deposerEtude(dz.dataset.id, ev.dataTransfer.files[0]); return; }
    if(dz.id==="depot-eml"){ if(ev.dataTransfer.files.length) deposerEml(dz, ev.dataTransfer.files); return; }
    if(dz.id==="depot-src"){ if(ev.dataTransfer.files.length) deposerSources(dz.dataset.code, ev.dataTransfer.files); return; }
    const f=ev.dataTransfer.files[0]; if(f) deposer(dz.dataset.id,f); } });

  /* ---------- routeur ---------- */
  async function route(silencieux){
    const hs=(location.hash||"#/").slice(2).split("/"); const r=hs[0]||""; let on="accueil", html;
    if(r!=="site") clearTimeout(pollSite);
    const y=window.scrollY;
    try{
      if(r===""){ html=await pageAccueil(); }
      else if(r==="sites"){ html=await pageSites(); on="sites"; }
      else if(r==="site"){ if(silencieux && document.querySelector("#app .fl.mod")){ return; } html=await pageSite(decodeURIComponent(hs[1])); on="sites"; }
      else if(r==="projets"){ html=await pageProjets(); on="projets"; }
      else if(r==="projet"){ html=await pageProjet(decodeURIComponent(hs[1])); on="projets"; }
      else if(r==="nouveau-projet"){ html=await pageNouveauProjet(); on="projets"; }
      else if(r==="demande"){ html=await pageDemande(decodeURIComponent(hs[1])); on="demandes"; }
      else if(r==="demandes"){ html=await pageDemandes(); on="demandes"; }
      else if(r==="nouvelle"){ html=await pageNouvelle(decodeURIComponent(hs[1]),hs[2]); on="projets"; }
      else if(r==="mails"){ html=await pageMails(); on="mails"; }
      else if(r==="contacts"){ html=await pageContacts(); on="contacts"; }
      else if(r==="verifier"){ html=await pageVerifier(); on="verifier"; }
      else if(r==="documents"){ html=await pageDocuments(); on="documents"; }
      else if(r==="journal"){ html=await pageJournal(); on="journal"; }
      else if(r==="alerte"){ html=await pageAlerte(); on="alerte"; }
      else { html=await pageAccueil(); }
    }catch(e){ html='<div class="err">'+esc(e.message)+'</div><p><a href="#/">Retour au tableau de bord</a></p>'; }
    $("#app").innerHTML=html;
    document.querySelectorAll("#menu a").forEach(a=>a.classList.toggle("on",a.dataset.r===on));
    api("/sante").then(x=>{ const b=$("#nb-verif"); b.textContent=x.a_verifier||""; b.hidden=!x.a_verifier; }).catch(()=>{});
    window.scrollTo(0, silencieux===true ? y : 0);
  }
  window.addEventListener("hashchange",()=>route());
  (async ()=>{
    try{ REF=await api("/referentiel"); const m=await api("/moi"); MOI=m.auteur; $("#enseigne").textContent=REF.enseigne; document.title="Amont · "+REF.enseigne;
      if(MOI.indexOf("@")>0 && !lireMoi()) $("#who").innerHTML="connecté · <b>"+esc(MOI)+"</b>";
      else { $("#moi").value=lireMoi(); $("#liste-moi").innerHTML=(REF.utilisateurs||[]).map(u=>'<option value="'+esc(u)+'">').join(""); } }
    catch(e){ $("#app").innerHTML='<div class="err">Le registre ne répond pas : '+esc(e.message)+'</div>'; return; }
    route();
  })();
})();
</script>
</body>
</html>
